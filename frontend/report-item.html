<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Item | Campus Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <h2>Campus Lost & Found</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="student-dashboard.html">Dashboard</a>
            <button onclick="logout()">Logout</button>
        </nav>
    </header>

    <section class="auth-section">

        <div class="auth-container">

            <h1>Report an Item</h1>

            <p>Help the campus community by reporting a lost or found item.</p>

            <form id="reportForm">

                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input
                        type="text"
                        id="itemName"
                        placeholder="Example: Black Laptop Bag"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Bags">Bags</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Books">Books</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Documents">Documents</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="Describe the item..."
                        rows="4"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="Where was it lost or found?"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="listingType">Report Type</label>

                    <select id="listingType" required>
                        <option value="">Select Report Type</option>
                        <option value="lost">Lost Item</option>
                        <option value="found">Found Item</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">Image URL (Optional)</label>
                    <input
                        type="url"
                        id="image"
                        placeholder="Paste an image URL"
                    >
                </div>

                <button type="submit" class="auth-btn">
                    Submit Report
                </button>

                <p id="reportMessage" class="form-message"></p>

            </form>

        </div>

    </section>

    <script src="js/report.js"></script>

</body>
</html>
