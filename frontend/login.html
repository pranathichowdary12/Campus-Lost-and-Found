<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campus Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                Campus <span>Lost & Found</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>

        </nav>
    </header>

    <main class="auth-section">

        <div class="auth-container">

            <div class="auth-heading">
                <h1>Welcome Back!</h1>

                <p>
                    Login to access your Campus Lost and Found account.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">University Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn">
                    Login
                </button>

                <p id="loginMessage" class="form-message"></p>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="register.html">Register here</a>
            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 Sai University | Campus Lost and Found Portal</p>
        <p>School of Computing and Data Science</p>
    </footer>

    <script src="js/auth.js"></script>

</body>

</html>
